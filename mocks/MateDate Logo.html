<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MateDate · Logo Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Space+Mono:wght@400;700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #f1e8d9;
    --cream-2: #e7dcc8;
    --paper: #f7f0e3;
    --ink: #272320;
    --ink-soft: #4a443c;
    --rosy: #d6536a;
    --rosy-deep: #b8324c;
    --king: #fbf6ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Bricolage Grotesque', system-ui, sans-serif; background: #ece7df; }

  /* ---- shared logo primitives ---- */
  .scene { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .glyph { font-family: 'Noto Sans Symbols 2', sans-serif; line-height: 1; display: inline-block; }
  .king {
    color: var(--king);
    -webkit-text-stroke: 2.5px var(--ink);
    text-stroke: 2.5px var(--ink);
    filter: drop-shadow(0 6px 0 rgba(39,35,32,0.06));
  }
  .queen { color: var(--ink); }

  .bang {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    color: var(--rosy);
    line-height: 0.8;
    letter-spacing: -0.04em;
  }

  /* wordmark */
  .wordmark {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1;
  }
  .wm-mate { color: var(--ink); }
  .wm-date { color: var(--rosy); }

  .mono { font-family: 'Space Mono', monospace; }

  /* baseline + shadow helpers */
  .shadow-blob {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 64%; height: 18px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(39,35,32,0.18), rgba(39,35,32,0) 70%);
  }
  .arrowhead {
    width: 0; height: 0;
  }
  .tag {
    font-family: 'Space Mono', monospace; font-weight:700;
    font-size: 13px; letter-spacing: 0.02em;
    color: #8a8175; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    // Real chess artwork extracted from the uploaded Cburnett sprite
    const KingImg = ({ size, style }) => (
      <img src="assets/white-king.svg" alt="white king" style={{ width:size, height:size, display:'block', ...style }} />
    );
    const QueenImg = ({ size, style }) => (
      <img src="assets/black-queen.svg" alt="black queen" style={{ width:size, height:size, display:'block', ...style }} />
    );
    const HEART = '\u2665';  // ♥

    function Wordmark({ size = 52 }) {
      return (
        <div className="wordmark" style={{ fontSize: size }}>
          <span className="wm-mate">Mate</span><span className="wm-date">Date</span>
        </div>
      );
    }

    /* ============ A · On the Board ============ */
    function DirA() {
      return (
        <div className="scene" style={{ background: 'var(--cream)' }}>
          {/* threat line + arrow */}
          <svg viewBox="0 0 512 512" style={{ position:'absolute', inset:0, width:'100%', height:'100%' }}>
            <line x1="196" y1="236" x2="316" y2="196" stroke="var(--rosy)" strokeWidth="5" strokeDasharray="3 12" strokeLinecap="round" />
            <path d="M320 194 l-23 -1 l8 19 z" fill="var(--rosy)" />
          </svg>

          {/* pieces on a baseline */}
          <div style={{ position:'absolute', left:0, right:0, top:120, display:'flex', justifyContent:'center', alignItems:'flex-end', gap:8 }}>
            <div style={{ position:'relative' }}>
              <QueenImg size={150} />
            </div>
            <div style={{ position:'relative' }}>
              <span className="bang" style={{ position:'absolute', top:6, right:-22, fontSize:60 }}>!!</span>
              <KingImg size={178} />
            </div>
          </div>
          {/* board edge line */}
          <div style={{ position:'absolute', left:64, right:64, top:330, height:3, background:'var(--ink)', borderRadius:2, opacity:0.85 }}></div>

          <div style={{ position:'absolute', left:0, right:0, top:366, textAlign:'center' }}>
            <Wordmark size={62} />
          </div>
        </div>
      );
    }

    /* ============ B · Threat Square (digital board) ============ */
    function DirB() {
      const sq = 92;
      return (
        <div className="scene" style={{ background: 'var(--paper)' }}>
          {/* mini board */}
          <div style={{ position:'absolute', top:64, left:'50%', transform:'translateX(-50%)',
            display:'grid', gridTemplateColumns:`repeat(3, ${sq}px)`, gridTemplateRows:`repeat(2, ${sq}px)`,
            borderRadius:16, overflow:'hidden', boxShadow:'0 16px 34px rgba(39,35,32,0.16)' }}>
            {[0,1,2,3,4,5].map(i => {
              const r = Math.floor(i/3), c = i%3;
              const dark = (r+c)%2===1;
              const isKing = i===5;     // bottom-right
              const isQueen = i===0;    // top-left (diagonal attacker)
              return (
                <div key={i} style={{ width:sq, height:sq, position:'relative',
                  background: isKing ? 'var(--rosy)' : (dark ? 'var(--cream-2)' : 'var(--cream)'),
                  display:'flex', alignItems:'center', justifyContent:'center' }}>
                  {isQueen && <QueenImg size={74} style={{ marginTop:6 }} />}
                  {isKing && <KingImg size={80} style={{ marginTop:6 }} />}
                </div>
              );
            })}
          </div>
          {/* attack ray across the diagonal */}
          <svg viewBox="0 0 512 512" style={{ position:'absolute', inset:0, width:'100%', height:'100%', pointerEvents:'none' }}>
            <line x1="214" y1="118" x2="300" y2="204" stroke="var(--rosy-deep)" strokeWidth="5" strokeDasharray="2 10" strokeLinecap="round" opacity="0.92"/>
          </svg>
          {/* eval badge */}
          <div style={{ position:'absolute', top:54, left:'50%', transform:'translateX(108px)',
            background:'var(--ink)', color:'var(--king)', borderRadius:11, padding:'6px 12px',
            fontFamily:"'Bricolage Grotesque', sans-serif", fontWeight:800, fontSize:26, letterSpacing:'-0.03em',
            boxShadow:'0 6px 14px rgba(39,35,32,0.2)' }}>
            !!
          </div>

          <div style={{ position:'absolute', left:0, right:0, top:378, textAlign:'center' }}>
            <Wordmark size={62} />
          </div>
        </div>
      );
    }

    /* ============ C · Face-off (dark) ============ */
    function DirC() {
      // subtle light rim so the black queen reads against the dark field
      const queenRim = 'drop-shadow(1px 0 0 rgba(241,232,217,0.55)) drop-shadow(-1px 0 0 rgba(241,232,217,0.55)) drop-shadow(0 1px 0 rgba(241,232,217,0.55)) drop-shadow(0 -1px 0 rgba(241,232,217,0.55))';
      return (
        <div className="scene" style={{ background: 'var(--ink)' }}>
          <div style={{ position:'absolute', left:0, right:0, top:150, display:'flex', justifyContent:'center', alignItems:'flex-end', gap:10 }}>
            <QueenImg size={150} style={{ filter: queenRim }} />
            <div style={{ position:'relative' }}>
              {/* exclamations hugging the distressed king */}
              <span className="bang" style={{ position:'absolute', top:-6, right:-30, fontSize:58, textShadow:'0 0 22px rgba(214,83,106,0.55)' }}>!!</span>
              <KingImg size={168} style={{ transform:'rotate(13deg)', transformOrigin:'bottom center' }} />
            </div>
          </div>

          <div style={{ position:'absolute', left:0, right:0, top:372, textAlign:'center' }}>
            <div className="wordmark" style={{ fontSize:62 }}>
              <span style={{ color:'var(--king)' }}>Mate</span><span className="wm-date">Date</span>
            </div>
          </div>
        </div>
      );
    }

    /* ============ D · Heart Check (playful) ============ */
    function DirD() {
      return (
        <div className="scene" style={{ background: 'var(--cream)' }}>
          {/* heart between them */}
          <span className="glyph" style={{ position:'absolute', top:70, left:'50%', transform:'translateX(-50%)',
            fontSize:72, color:'var(--rosy)', filter:'drop-shadow(0 5px 0 rgba(184,50,76,0.18))' }}>{HEART}</span>
          {/* bangs tucked by the heart */}
          <span className="bang" style={{ position:'absolute', top:74, left:'50%', transform:'translateX(42px)', fontSize:48 }}>!!</span>

          {/* king + queen leaning toward each other */}
          <div style={{ position:'absolute', left:0, right:0, top:150, display:'flex', justifyContent:'center', alignItems:'flex-end', gap:0 }}>
            <KingImg size={166} style={{ transform:'rotate(12deg)', transformOrigin:'bottom center' }} />
            <QueenImg size={166} style={{ transform:'rotate(-12deg)', transformOrigin:'bottom center' }} />
          </div>

          <div style={{ position:'absolute', left:0, right:0, top:372, textAlign:'center' }}>
            <Wordmark size={62} />
          </div>
        </div>
      );
    }

    const SIZE = 512;

    /* ============ C-mark · King + !! only (compact icon) ============ */
    function DirCMark() {
      return (
        <div className="scene" style={{ background: 'var(--ink)' }}>
          {/* king dead-centered in the icon */}
          <KingImg size={150} style={{ position:'absolute', top:'50%', left:'50%',
            transform:'translate(-50%, -50%) rotate(13deg)', transformOrigin:'center' }} />
          {/* !! anchored to the king's upper-right without shifting it off-center */}
          <span className="bang" style={{ position:'absolute', top:'24%', left:'72%', fontSize:54,
            textShadow:'0 0 22px rgba(214,83,106,0.55)' }}>!!</span>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="logos" title="MateDate · Logo" subtitle="White king in check from the black queen · !! = a brilliant move">
            <DCArtboard id="c" label="C · Face-off (dark)" width={SIZE} height={SIZE}><DirC /></DCArtboard>
            <DCArtboard id="c-mark" label="C · App icon (king + !!)" width={256} height={256}><DirCMark /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
