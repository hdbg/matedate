nodeLinker: pnp

# eslint-config-next requires `next` at runtime (next/dist/compiled/babel/eslint-parser) but
# doesn't declare it as a dependency. Under a single-package layout PnP's top-level fallback pool
# covered this; in the workspace layout `next` lives in apps/web, so the missing dependency must be
# declared explicitly. See https://yarnpkg.com/configuration/yarnrc#packageExtensions
packageExtensions:
  "eslint-config-next@*":
    dependencies:
      next: "*"
