# https://taskfile.dev/docs/reference/schema
# Run with `task dev` (task is provided by mise — see mise.toml).
version: "3"

tasks:
  dev:
    desc: Start local Supabase, the backend, the analysis/archetype worker, and the frontend.
    deps: [backend, worker, frontend]

  gen-types:
    desc: Generate the typed DB schema (backend/app/database_types.py) from local Supabase.
    deps: [supabase]
    # Runs from the repo root so the CLI finds supabase/config.toml. Regenerate after any
    # schema change (edit the single migration, then `supabase db reset` + `task gen-types`).
    cmds:
      - supabase gen types --lang=python --local > backend/app/database_types.py

  supabase:
    desc: Start the local Supabase stack (skipped if it is already running).
    run: once
    cmds:
      - supabase start
    # `supabase status` exits non-zero when the stack is down, so this only
    # runs `supabase start` when it isn't already up.
    status:
      - supabase status

  backend:
    desc: Run the FastAPI backend against local Supabase.
    deps: [supabase]
    dir: backend
    # Reads backend/.env (local Supabase URL + service-role key). Port 8000
    # matches the frontend's NEXT_PUBLIC_BACKEND_WS_URL.
    cmds:
      - uv run uvicorn main:app --reload --host 127.0.0.1 --port 8000

  worker:
    desc: Run the post-game worker (game_analysis + game_archetype pgmq consumers) against local Supabase.
    deps: [supabase]
    dir: backend
    # Reads backend/.env. One process drains both queues concurrently (deep analysis + the fast
    # archetype pass, each its own submodule). Idles cheaply polling; with FAKE_ENGINE / no
    # OpenRouter key it runs the deterministic fake engines.
    cmds:
      - uv run python worker.py

  enqueue-analysis:
    desc: "Enqueue a finished game for analysis: task enqueue-analysis -- <game-id> (or -- --latest)."
    deps: [supabase]
    dir: backend
    # -m keeps backend/ on sys.path so `app.*` imports resolve.
    cmds:
      - uv run python -m scripts.enqueue_analysis {{.CLI_ARGS}}

  # Offline content authoring against a local LM Studio server (no DB access): `generate`
  # writes a JSON file for manual review, `seed` appends the reviewed file to
  # supabase/seed.sql (apply with `supabase db reset`).
  gen-personas:
    desc: "Author personas with LM Studio: task gen-personas -- generate [-n N] | seed [file]."
    dir: backend
    cmds:
      - uv run python -m scripts.generate_personas {{.CLI_ARGS}}

  gen-puzzles:
    desc: "Author puzzles with LM Studio: task gen-puzzles -- generate [-n N] [--persona <slug>] | seed [file]."
    dir: backend
    cmds:
      - uv run python -m scripts.generate_puzzles {{.CLI_ARGS}}

  frontend:
    desc: Run the Next.js dev server against local Supabase.
    deps: [supabase]
    dir: frontend
    # Reads frontend/.env.local (local Supabase URL + backend WS URL).
    cmds:
      - yarn dev
