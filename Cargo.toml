[package]
name = "checkdate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
config = "0.15.23"
serde = { version = "1.0.228", features = ["derive"] }
teloxide = { version = "0.17.0", features = ["rustls", "sqlite-storage-rustls"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
