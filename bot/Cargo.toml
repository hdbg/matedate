[package]
name = "matedate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
config = "0.15.23"
image = "0.25.10"
imageproc = "0.26.2"
opencv = { version = "0.98.2", features = ["clang-runtime"] }
ocr-rs = "2.2.2"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
teloxide = { version = "0.17.0", features = ["rustls", "sqlite-storage-rustls"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
include_dir = { version = "0.7.4", features = ["glob"] }
schemars = "1.2.1"
rig = "0.38.1"
serde_json = "1.0.150"
kameo = "0.20.0"
diesel = { version = "2.3.9", features = ["sqlite", "chrono"] }
diesel-async = { version = "0.9.0", features = ["bb8", "migrations", "sqlite", "tokio"] }
thiserror = "2.0.18"
diesel_migrations = "2.3.2"
restructed = "0.2.2"
chrono = "0.4.44"
sha2 = "0.10.9"
